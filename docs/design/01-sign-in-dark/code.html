<script>
  function selectProfile(id) {
    const aarav = document.getElementById('tile-aarav');
    const neha = document.getElementById('tile-neha');
    const indA = aarav.querySelector('.selection-indicator');
    const indN = neha.querySelector('.selection-indicator');
    
    if (id === 'aarav') {
      aarav.classList.add('bg-surface-container-high');
      aarav.classList.remove('bg-surface-container');
      neha.classList.remove('bg-surface-container-high');
      neha.classList.add('bg-surface-container');
      indA.classList.add('bg-primary-fixed');
      indA.classList.remove('bg-transparent');
      indN.classList.remove('bg-primary-fixed');
      indN.classList.add('bg-transparent');
    } else {
      neha.classList.add('bg-surface-container-high');
      neha.classList.remove('bg-surface-container');
      aarav.classList.remove('bg-surface-container-high');
      aarav.classList.add('bg-surface-container');
      indN.classList.add('bg-primary-fixed');
      indN.classList.remove('bg-transparent');
      indA.classList.remove('bg-primary-fixed');
      indA.classList.add('bg-transparent');
    }
  }

  function togglePassVisibility() {
    const input = document.getElementById('passkey-input');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  let totalSeconds = 6130;
  setInterval(() => {
    if (totalSeconds > 0) {
      totalSeconds--;
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      const timer = document.getElementById('telemetry-timer');
      if (timer) timer.textContent = `${h}:${m}:${s}`;
    }
  }, 1000);
