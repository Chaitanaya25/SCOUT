[project]
name = "scout-worker"
version = "0.1.0"
description = "SCOUT worker: job scanning, matching and alerts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-jobspy>=1.3.0",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is the formatter's job (long strings/docstrings are fine)

[tool.pytest.ini_options]
testpaths = ["tests"]
